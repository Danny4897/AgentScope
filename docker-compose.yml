version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentscope-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentscope
      POSTGRES_PASSWORD: agentscope_dev
      POSTGRES_DB: agentscope
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentscope"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentscope-cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: agentscope-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Database=agentscope;Username=agentscope;Password=agentscope_dev"
      ConnectionStrings__Redis: "redis:6379"
    ports:
      - "5100:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: agentscope-web
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiBaseUrl: "http://api:8080"
      ConnectionStrings__Postgres: "Host=postgres;Database=agentscope;Username=agentscope;Password=agentscope_dev"
      ConnectionStrings__Redis: "redis:6379"
    ports:
      - "5101:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - web_dp_keys:/data/dp-keys

volumes:
  postgres_data:
  redis_data:
  web_dp_keys:
